<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>לוח מסדרון</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  /* ================================================================
     Corridor dashboard — designed at a fixed 1920×1080 canvas.
     The TV renders it 1:1; any other window scales it to fit.
     Dark, OLED-safe: dark surfaces, no pure-white fields, slow
     pixel drift on the whole canvas.
     Palette: dataviz reference palette, dark column.
     Grade count is data-driven: 6 grades → exams panel spans the
     full left column; 7 grades → 7th card takes the top-left cell
     and the exams panel moves below it.
     ================================================================ */
  :root {
    --page:        #0d0d0d;
    --surface:     #1a1a19;
    --ink:         #e8e6df;   /* softened primary — kinder to OLED than #fff */
    --ink-strong:  #f6f5ef;
    --ink-2:       #c3c2b7;
    --muted:       #898781;
    --hairline:    #2c2c2a;
    --border:      rgba(255,255,255,0.10);
    /* grade accents = categorical dark slots 1–7, documented order */
    --g1: #3987e5;  /* blue    */
    --g2: #d95926;  /* orange  */
    --g3: #199e70;  /* aqua    */
    --g4: #c98500;  /* yellow  */
    --g5: #d55181;  /* magenta */
    --g6: #008300;  /* green   */
    --g7: #9085e9;  /* violet — used only if a 7th grade appears */
    --critical: #d03b3b;
    --warning:  #fab219;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: var(--page); overflow: hidden; }
  body {
    font-family: "Noto Sans Hebrew", "Segoe UI", system-ui, sans-serif;
    color: var(--ink);
  }

  /* -- fixed canvas, scaled to fit the window ---------------------- */
  #stage {
    width: 1920px; height: 1080px;
    position: absolute; top: 50%; left: 50%;
    transform-origin: center center;
    display: flex; flex-direction: column;
    padding: 28px 36px 20px;
    gap: 18px;
  }
  /* slow pixel drift (burn-in): ±3px square, 10-minute lap.
     min-height:0 is load-bearing — without it this flex child floors
     at its content height and overflows the 1080px canvas. */
  #drift { flex: 1; min-height: 0; display: flex; flex-direction: column;
           gap: 18px; animation: drift 600s steps(1) infinite; }
  @keyframes drift {
    0%   { transform: translate( 0px,  0px); }
    25%  { transform: translate( 3px,  2px); }
    50%  { transform: translate( 0px,  4px); }
    75%  { transform: translate(-3px,  2px); }
    100% { transform: translate( 0px,  0px); }
  }

  /* -- header: clock + dates on the right, urgent strip (or school
        name when there is nothing urgent) filling the left ---------- */
  header { display: flex; align-items: center; gap: 24px; height: 72px; }
  #clock  { font-size: 60px; font-weight: 700; color: var(--ink-strong);
            font-variant-numeric: tabular-nums; line-height: 1; flex: none; }
  .dates  { display: flex; flex-direction: column; gap: 2px; flex: none; }
  #date   { font-size: 22px; color: var(--ink-2); }
  #hebdate{ font-size: 20px; color: var(--muted); }
  #school { margin-inline-start: auto; font-size: 28px; font-weight: 600;
            color: var(--ink-2); }

  /* urgent strip lives in the header, in lieu of the school name */
  #urgent {
    display: none; align-items: center; gap: 14px; flex: 1; min-width: 0;
    background: rgba(208,59,59,0.16);
    border: 2px solid var(--critical);
    border-radius: 12px; padding: 8px 18px;
  }
  #urgent.on { display: flex; }
  #urgent.on ~ #school { display: none; }
  #urgent .icon { font-size: 26px; line-height: 1; }
  #urgent .tag  { color: var(--critical); font-size: 20px; font-weight: 700;
                  border: 1.5px solid var(--critical); border-radius: 8px;
                  padding: 1px 10px; white-space: nowrap; }
  #urgenttext   { transition: opacity 0.6s; white-space: nowrap;
                  overflow: hidden; text-overflow: ellipsis;
                  font-size: 26px; font-weight: 700; color: var(--ink-strong); }

  /* -- main grid: 3 grade columns (start/right) + left column ------ */
  main {
    flex: 1; min-height: 0;
    display: grid;
    grid-template-columns: 1fr 1fr 1fr 400px;
    grid-template-rows: minmax(0, 1fr) minmax(0, 1fr);
    gap: 18px;
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px 18px 12px;
    display: flex; flex-direction: column;
    min-height: 0; overflow: hidden;
  }
  .card h2 {
    font-size: 32px; font-weight: 700; color: var(--ink-strong);
    display: flex; align-items: center; gap: 12px;
    padding-bottom: 8px; border-bottom: 1px solid var(--hairline);
    margin-bottom: 6px;
  }
  .card h2 .chip { width: 15px; height: 30px; border-radius: 4px;
                   background: var(--accent); flex: none; }

  /* rows always top-aligned at a fixed pitch — identical rhythm in
     every card whether it is full or half-empty */
  .periods { flex: 1; min-height: 0; overflow: hidden; position: relative; }
  .pwrap   { display: flex; flex-direction: column;
             transition: transform 0.9s cubic-bezier(.4,0,.2,1);
             will-change: transform; }
  /* card overflows: the wrapper is translated page by page */
  /* all of today's classes are over */
  .periods.empty::after { content: "יום הלימודים הסתיים";
                          color: var(--muted); font-size: 24px;
                          text-align: center; margin-top: 42px; }
  .period  { display: flex; align-items: center; gap: 12px;
             font-size: 28px; line-height: 1.1; height: 52px; flex: none;
             padding: 2px 8px; border-radius: 8px; }
  .period .time { color: var(--muted); font-variant-numeric: tabular-nums;
                  font-size: 24px; font-weight: 600; width: 142px;
                  flex: none; }
  .period .subj { color: var(--ink); font-weight: 600;
                  white-space: nowrap; overflow: hidden;
                  text-overflow: ellipsis; }
  .period.now  { background: color-mix(in srgb, var(--accent) 16%, transparent);
                 box-shadow: inset 3px 0 0 var(--accent); }
  .period.now .subj { color: var(--ink-strong); }
  .period.done { display: none; }   /* passed classes free up space */

  /* the 7th grade card, when present, sits top-left (col 4, row 1) */
  .card.seventh { grid-column: 4; grid-row: 1; }

  /* -- exams panel: full left column, or bottom-left in 7-grade mode */
  #exams { grid-column: 4; grid-row: 1 / span 2; }
  main.grades7 #exams { grid-row: 2; }
  #exams h2 { font-size: 28px; }
  #examlist { flex: 1; display: flex; flex-direction: column; gap: 14px;
              padding-top: 10px; overflow: hidden; }
  .exam { border: 1px solid var(--hairline); border-radius: 10px;
          padding: 12px 16px; }
  .exam .row1 { display: flex; align-items: baseline; gap: 10px;
                font-size: 26px; font-weight: 700; color: var(--ink-strong);
                min-width: 0; }
  .exam .row1 .ttl { white-space: nowrap; overflow: hidden;
                     text-overflow: ellipsis; }
  .exam .grade { font-size: 21px; font-weight: 700; color: var(--page);
                 background: var(--gcolor); border-radius: 7px;
                 padding: 1px 10px; white-space: nowrap; flex: none; }
  .exam .row2 { display: flex; gap: 18px; font-size: 22px;
                color: var(--ink-2); margin-top: 4px;
                font-variant-numeric: tabular-nums; white-space: nowrap; }
  /* events: compact per-grade chips on their own row */
  .exam .chips { display: flex; gap: 6px; margin-top: 8px; flex-wrap: nowrap; }
  .exam .chips .gchip { font-size: 19px; font-weight: 700; color: var(--page);
                        background: var(--gcolor); border-radius: 6px;
                        padding: 1px 9px; }
  .exam .chips .gchip.all { background: var(--muted); }
  #noexams { color: var(--muted); font-size: 26px; text-align: center;
             margin-top: 40px; }

  /* -- footer: rotating messages + updated stamp -------------------- */
  footer {
    height: 66px; display: flex; align-items: center; gap: 24px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 14px; padding: 0 24px;
  }
  /* continuous ticker: two identical copies slide rightward (RTL
     reading direction); shifting by exactly one copy loops seamlessly */
  #msg { flex: 1; font-size: 28px; color: var(--ink);
         overflow: hidden; min-width: 0; }
  .ticker { display: flex; width: max-content; white-space: nowrap;
            animation: tickmove var(--dur, 40s) linear infinite; }
  @keyframes tickmove { from { transform: translateX(0); }
                        to   { transform: translateX(50%); } }
  /* flex children ignore literal text spaces — the gap provides the
     spacing between bullet, counter, and message text */
  .titem { display: inline-flex; align-items: baseline; gap: 14px;
           padding-inline-end: 90px; }
  .titem .bullet { color: var(--g1); }
  .count { direction: ltr; unicode-bidi: isolate; color: var(--muted);
           font-weight: 600; margin-inline-end: 14px; }
  #stamp { font-size: 20px; color: var(--muted); flex: none;
           font-variant-numeric: tabular-nums; }
  #stamp.stale { color: var(--warning); }
</style>
</head>
<body>
<div id="stage">
  <div id="drift">
    <header>
      <div id="clock">--:--</div>
      <div class="dates">
        <div id="date"></div>
        <div id="hebdate"></div>
      </div>
      <div id="urgent">
        <span class="icon">⚠️</span>
        <span class="tag">הודעות דחופות</span>
        <span id="urgenttext"></span>
      </div>
      <div id="school">תיכון השיטה</div>
    </header>

    <main id="grid">
      <!-- grade cards injected here -->
      <section class="card" id="exams">
        <h2>אירועים ומבחנים היום</h2>
        <div id="examlist"></div>
      </section>
    </main>

    <footer>
      <div id="msg"></div>
      <div id="stamp"></div>
    </footer>
  </div>
</div>

<script>
/* ==================================================================
   MOCK DATA — this block will be replaced by the Google-Sheets CSV
   fetch in the next phase. The render functions below stay as-is.

   The grade list is DATA-DRIVEN: it will come from the Schedule
   tab's column headers. 6 grades → exams fill the left column;
   7 grades → the 7th card takes top-left and exams move below it.
   Preview the 7-grade layout by adding ?demo7 to the URL.
   ================================================================== */
let GRADES = ["ז׳", "ח׳", "ט׳", "י׳", "י\"א", "י\"ב"];
const ACCENTS = ["--g1", "--g2", "--g3", "--g4", "--g5", "--g6", "--g7"];

let MOCK_SCHEDULE = [
  // period, start, end, subjects per grade ז..י"ב ("" = no class)
  [1, "08:00", "08:45", ["מתמטיקה", "אנגלית",     "פיזיקה",     "ספרות",    "מתמטיקה",  "אזרחות"]],
  [2, "08:50", "09:35", ["לשון",     "מתמטיקה",   "אנגלית",     "מתמטיקה", "פיזיקה",    "מתמטיקה"]],
  [3, "09:50", "10:35", ["אנגלית",  "ביולוגיה",   "מתמטיקה",   "היסטוריה", "כימיה",     "אנגלית"]],
  [4, "10:40", "11:25", ["היסטוריה","לשון",        "ספרות",      "אנגלית",   "אנגלית",    "פיזיקה"]],
  [5, "11:45", "12:30", ["של\"ח",   "חינוך גופני", "תנ\"ך",      "כימיה",    "היסטוריה",  "ספרות"]],
  [6, "12:35", "13:20", ["ביולוגיה","תנ\"ך",       "חינוך גופני","ביולוגיה", "ספרות",     "היסטוריה"]],
  [7, "13:30", "14:15", ["מחשבים",  "מחשבים",     "אזרחות",     "של\"ח",    "לשון",      "תנ\"ך"]],
  [8, "14:20", "15:05", ["",         "",            "מחשבים",     "חינוך",    "חינוך",     "חינוך"]],
  [9, "15:15", "16:00", ["",         "",            "",            "מתמטיקה", "פיזיקה",    "מתמטיקה"]],
  [10,"16:05", "16:50", ["",         "",            "",            "",          "ספרות",     "אזרחות"]],
];

const MOCK_EXAMS = [
  { grade: "ט׳",    subject: "מתמטיקה", start: "09:00", end: "10:30", room: "חדר 12" },
  { grade: "י\"ב", subject: "אנגלית",  start: "11:45", end: "12:30", room: "ספרייה" },
  { grade: "ח׳",    subject: "ביולוגיה", start: "12:35", end: "13:20", room: "מעבדה" },
];

const MOCK_EVENTS = [
  // an event applies to one or more grades; 4+ grades collapse to "כל השכבות"
  { title: "חזרה כללית לטקס",      grades: ["ז׳", "ח׳"],            start: "10:40", end: "11:25", room: "אולם ספורט" },
  { title: "הרצאה: בטיחות ברשת",  grades: ["י׳", "י\"א", "י\"ב"], start: "12:35", end: "13:20", room: "אודיטוריום" },
];

const MOCK_MESSAGES = [
  { text: "אסיפת הורים תתקיים ביום שלישי בשעה 19:00", type: "normal" },
  { text: "מחר: יום כחול-לבן — באים בלבוש חגיגי", type: "normal" },
  { text: "שיעורי שכבת ז׳ מסתיימים היום ב-13:20", type: "urgent" },
  { text: "ההסעה לקו הדרומי יוצאת היום ב-14:00 מהשער האחורי", type: "urgent" },
];

/* demo of the 7-grade layout: ?demo7 splits ז׳ into ז׳1 + ז׳2 */
if (new URLSearchParams(location.search).has("demo7")) {
  GRADES = ["ז׳1", "ח׳", "ט׳", "י׳", "י\"א", "י\"ב", "ז׳2"];
  MOCK_SCHEDULE = MOCK_SCHEDULE.map((p) => {
    const subj = [...p[3], p[3][0]];   // ז׳2 mirrors ז׳1's day for the demo
    return [p[0], p[1], p[2], subj];
  });
}

/* ================================================================
   RENDERING
   ================================================================ */
const $ = (id) => document.getElementById(id);

/* preview helper: ?time=10:30 simulates the clock (date stays real).
   MOCK DEFAULT: while in mockup mode the clock is pinned to 08:10 so
   the full-day design logic is visible — delete the fallback ("08:10")
   when wiring real data. */
const TIME_OVERRIDE =
  new URLSearchParams(location.search).get("time") || "08:10";
function NOW() {
  const d = new Date();
  if (TIME_OVERRIDE) {
    const [h, m] = TIME_OVERRIDE.split(":").map(Number);
    d.setHours(h, m, 0, 0);
  }
  return d;
}

function minutes(hhmm) {
  const [h, m] = hhmm.split(":").map(Number);
  return h * 60 + m;
}

function renderGrades() {
  const grid = $("grid");
  if (GRADES.length >= 7) grid.classList.add("grades7");
  GRADES.forEach((name, gi) => {
    const card = document.createElement("section");
    card.className = "card" + (gi === 6 ? " seventh" : "");
    card.style.setProperty("--accent", `var(${ACCENTS[gi]})`);
    const rows = MOCK_SCHEDULE
      .filter((p) => p[3][gi] !== "")
      .map((p) => `
        <div class="period" data-start="${p[1]}" data-end="${p[2]}">
          <span class="time">${p[1]}–${p[2]}</span>
          <span class="subj">${p[3][gi]}</span>
        </div>`).join("");
    card.innerHTML = `
      <h2><span class="chip"></span>כיתה ${name}</h2>
      <div class="periods"><div class="pwrap">${rows}</div></div>`;
    grid.insertBefore(card, $("exams"));
  });
}

/* exams + events merged into one agenda, sorted by start time */
function gradeColor(name) {
  const gi = GRADES.indexOf(name);
  return gi >= 0 ? `var(${ACCENTS[gi]})` : "var(--muted)";
}

function renderAgenda() {
  const list = $("examlist");
  const agenda = [
    ...MOCK_EXAMS.map((e) => ({ ...e, kind: "exam" })),
    ...MOCK_EVENTS.map((e) => ({ ...e, kind: "event" })),
  ].sort((a, b) => minutes(a.start) - minutes(b.start));

  if (agenda.length === 0) {
    list.innerHTML = `<div id="noexams">אין אירועים ומבחנים היום 🎉</div>`;
    return;
  }
  list.innerHTML = agenda.map((e) => {
    const row2 = `<div class="row2"><span>🕐 ${e.start}–${e.end}</span><span>📍 ${esc(e.room)}</span></div>`;
    if (e.kind === "exam") {
      return `
        <div class="exam" style="--gcolor:${gradeColor(e.grade)}">
          <div class="row1"><span class="grade">כיתה ${e.grade}</span><span class="ttl">${esc(e.subject)}</span></div>
          ${row2}
        </div>`;
    }
    const chips = e.grades.length >= 4
      ? `<span class="gchip all">כל השכבות</span>`
      : e.grades.map((g) =>
          `<span class="gchip" style="--gcolor:${gradeColor(g)}">${g}</span>`).join("");
    return `
      <div class="exam">
        <div class="row1"><span class="ttl">${esc(e.title)}</span></div>
        ${row2}
        <div class="chips">${chips}</div>
      </div>`;
  }).join("");
}

/* urgent banner + rotating normal messages — both rotate with a fade
   when the principal enters more than one message of that type, and
   both show a "(current/total)" counter, e.g. ‎(1/3) */
const esc = (s) => s.replace(/[&<>"']/g,
  (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function rotate(el, items, prefixHtml) {
  const set = (i) => {
    el.innerHTML = `${prefixHtml}<span class="count">(${i + 1}/${items.length})</span> ${esc(items[i].text)}`;
  };
  set(0);
  if (items.length > 1) {
    let i = 1;
    setInterval(() => {
      el.style.opacity = 0;
      setTimeout(() => { set(i % items.length); i++; el.style.opacity = 1; }, 600);
    }, 8000);
  }
}

function renderMessages() {
  const urgent = MOCK_MESSAGES.filter((m) => m.type === "urgent");
  $("urgent").classList.toggle("on", urgent.length > 0);
  if (urgent.length) rotate($("urgenttext"), urgent, "");

  /* bottom strip: all normal messages in one endless scrolling ticker */
  const normal = MOCK_MESSAGES.filter((m) => m.type === "normal");
  const el = $("msg");
  if (!normal.length) { el.textContent = ""; return; }
  const seq = normal.map((m, i) =>
    `<span class="titem"><span class="bullet">●</span><span class="count">(${i + 1}/${normal.length})</span><span>${esc(m.text)}</span></span>`
  ).join("");
  el.innerHTML = `<div class="ticker">${seq}${seq}</div>`;
  /* constant speed regardless of content length: ~80 px/s */
  const t = el.querySelector(".ticker");
  t.style.setProperty("--dur", (t.scrollWidth / 2 / 80) + "s");
}

/* Hebrew-letter (gematria) date: Intl computes the hebrew-calendar
   day/month/year, but ECMA-402 can't render the algorithmic "hebr"
   numbering system (it silently falls back to digits) — so the
   day and year are converted to Hebrew letters here. */
const GERESH = "׳", GERSHAYIM = "״";
function toGematria(n) {
  const ones = ["", "א", "ב", "ג", "ד", "ה", "ו", "ז", "ח", "ט"];
  const tens = ["", "י", "כ", "ל", "מ", "נ", "ס", "ע", "פ", "צ"];
  const hundreds = ["", "ק", "ר", "ש", "ת"];
  let s = "";
  while (n >= 500) { s += "ת"; n -= 400; }
  s += hundreds[Math.floor(n / 100)]; n %= 100;
  if (n === 15) s += "טו";        /* avoid spelling parts of the divine name */
  else if (n === 16) s += "טז";
  else s += tens[Math.floor(n / 10)] + ones[n % 10];
  return s.length === 1 ? s + GERESH : s.slice(0, -1) + GERSHAYIM + s.slice(-1);
}
function hebrewDate(d) {
  const parts = new Intl.DateTimeFormat("he-u-ca-hebrew",
    { day: "numeric", month: "long", year: "numeric" }).formatToParts(d);
  const get = (t) => parts.find((p) => p.type === t)?.value ?? "";
  return `${toGematria(+get("day"))} ${get("month")} ${toGematria(+get("year") % 1000)}`;
}

/* clock, date, current-period highlight, freshness stamp */
function stampNow() {
  const now = new Date();
  const d = now.toLocaleDateString("he-IL",
    { day: "2-digit", month: "2-digit", year: "numeric" });
  const t = now.toLocaleTimeString("he-IL",
    { hour: "2-digit", minute: "2-digit" });
  $("stamp").textContent = `עודכן ${d} · ${t}`;
}

function tick() {
  const now = NOW();
  $("clock").textContent = now.toLocaleTimeString("he-IL",
    { hour: "2-digit", minute: "2-digit" });
  $("date").textContent = now.toLocaleDateString("he-IL",
    { weekday: "long", day: "numeric", month: "long", year: "numeric" });
  $("hebdate").textContent = hebrewDate(now);

  const nowMin = now.getHours() * 60 + now.getMinutes();
  document.querySelectorAll(".period").forEach((p) => {
    const s = minutes(p.dataset.start), e = minutes(p.dataset.end);
    p.classList.toggle("now",  nowMin >= s && nowMin < e);
    p.classList.toggle("done", nowMin >= e);   /* passed → hidden */
  });
  /* a card whose classes are all over shows the end-of-day note */
  document.querySelectorAll(".periods").forEach((c) => {
    const left = c.querySelectorAll(".period:not(.done)").length;
    c.classList.toggle("empty", left === 0);
  });
  layoutPages();   /* row visibility changed → recompute pages */
  /* in mock mode the data is always "fresh"; once wired to the sheet,
     the stamp records the last successful fetch instead */
  stampNow();
}

/* -- paging: a card with more remaining classes than fit cycles
   through them page by page every 8 seconds, by translating the
   row wrapper (CSS transition does the animation) ----------------- */
const ROW_H = 52;   /* must match .period height */

function layoutPages() {
  document.querySelectorAll(".periods").forEach((c) => {
    const wrap = c.querySelector(".pwrap");
    if (!wrap) return;
    const rows = wrap.querySelectorAll(".period:not(.done)").length;
    const perPage = Math.max(1, Math.floor(c.clientHeight / ROW_H));
    /* snap pane height to a whole number of rows so a partial row
       never peeks out at the bottom */
    c.style.height = (perPage * ROW_H) + "px";
    c.style.flex = "none";
    const pages = Math.max(1, Math.ceil(rows / perPage));
    c.dataset.pages = pages;
    c.classList.toggle("paged", pages > 1);
    const cur = Math.min(+(c.dataset.page || 0), pages - 1);
    c.dataset.page = cur;
    /* scroll the minimum needed: the last page anchors to the final
       row instead of jumping a full page and leaving empty space */
    const start = Math.min(cur * perPage, Math.max(0, rows - perPage));
    wrap.style.transform = `translateY(-${start * ROW_H}px)`;
  });
}

function advancePages() {
  document.querySelectorAll(".periods.paged").forEach((c) => {
    c.dataset.page = (+(c.dataset.page || 0) + 1) % +(c.dataset.pages || 1);
  });
  layoutPages();
}
setInterval(advancePages, 8000);

/* scale the fixed 1920×1080 stage to fit any preview window */
function fit() {
  const s = Math.min(innerWidth / 1920, innerHeight / 1080);
  $("stage").style.transform =
    `translate(-50%, -50%) scale(${s})`;
}

renderGrades();
renderAgenda();
renderMessages();
tick();                    /* also runs layoutPages(): page 1 shown at load */
setInterval(tick, 5000);
fit();
addEventListener("resize", fit);
</script>
</body>
</html>
