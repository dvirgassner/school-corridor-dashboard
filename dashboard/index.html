<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>לוח מסדרון</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="stage">
  <div id="drift">
    <header>
      <div id="clock">--:--</div>
      <div class="dates">
        <div id="date"></div>
        <div id="hebdate"></div>
      </div>
      <!-- No hazard symbol here on purpose: this strip carries ordinary
           school notices, and a warning triangle reads as an emergency to
           a child walking past. The red frame and the tag are signal
           enough. The fault indicator in the footer keeps its triangle —
           that one really does mean something is broken. -->
      <div id="urgent">
        <span class="tag">הודעות דחופות</span>
        <span id="urgenttext"></span>
      </div>
      <div id="school">תיכון השיטה</div>
    </header>

    <main id="grid">
      <!-- grade cards injected here -->
      <!-- left column: day-of-the-day strip, then the agenda pane
           directly beneath it (a flex column, so the agenda takes
           whatever height the strip leaves rather than snapping to the
           grid's bottom row) -->
      <div id="leftcol">
        <section class="card" id="dayofday">
          <div class="dodicon"></div>
          <div class="dodtext"></div>
        </section>
        <section class="card" id="exams">
          <h2>אירועים ומבחנים היום</h2>
          <div id="examlist"><div class="agendawrap"></div></div>
        </section>
      </div>
    </main>

    <footer>
      <div id="msg"></div>
      <!-- bottom-left corner: freshness stamp, version, then the fault
           indicator LAST — in RTL the last child sits leftmost, which
           is where the indicator belongs -->
      <div class="statusbox">
        <span id="stamp"></span>
        <span id="version"></span>
        <span id="errind"></span>
      </div>
    </footer>
  </div>
</div>

<!-- full-screen video overlay; hidden unless a clip is playing.
     Direct/Drive files use <video>; YouTube uses its official embed. -->
<div id="videowrap">
  <video id="video" playsinline></video>
  <iframe id="ytframe" allow="autoplay; encrypted-media" frameborder="0"></iframe>
</div>

<!-- load order matters: config → sample data → CSV parser → pure
     logic → app. -->
<script src="config.js"></script>
<script src="days.js"></script>
<script src="sample-data.js"></script>
<script src="vendor/papaparse.min.js"></script>
<script src="logic.js"></script>
<script src="app.js"></script>
</body>
</html>
