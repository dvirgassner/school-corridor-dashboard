<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>לוח מסדרון</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="style.css">
<!-- The theme lives in the sheet, so it cannot be known until the CSVs
     arrive a second or two from now. Without this the board paints in the
     default dark theme first and visibly switches once the data lands —
     which looks like a fault every single time the screen reloads.

     So the last theme seen is remembered and re-applied HERE, inline in
     the head, because this is the only place that runs before the first
     paint: app.js is at the end of the body and by then the wrong colours
     are already on screen. app.js still sets the real theme when the
     sheet is read, so a theme CHANGE still takes one reload to settle —
     but the everyday case, reloading with the theme unchanged, no longer
     flashes at all. Wrapped in try/catch because a browser with storage
     disabled must still show a board. -->
<script>
  try {
    var t = localStorage.getItem("dash-theme");
    if (t) document.documentElement.setAttribute("data-theme", t);
  } catch (e) { /* no storage → the default theme, as before */ }
</script>
<!-- Boot watchdog. A corridor board has nobody to press reload, so a page
     that comes up wrong stays wrong until someone drives to the school.
     That happened: a failed fetch for style.css was answered with the HTML
     shell, leaving a white screen with no stylesheet and no script — and
     because app.js never ran, the update check that would have reloaded it
     never ran either. The page could not heal itself by design.

     So this checks, from the head, that the board actually came up: that
     the stylesheet applied (its custom properties resolve) and that app.js
     reached its last line. If not, reload. Backs off after a few tries so
     a genuinely offline board is not reloading every few seconds all night,
     but never gives up entirely — the network usually does come back. -->
<script>
  (function () {
    var KEY = "dash-boot-tries";
    function tries() {
      try { return +(sessionStorage.getItem(KEY) || 0); } catch (e) { return 0; }
    }
    function check() {
      var styled = !!getComputedStyle(document.documentElement)
                     .getPropertyValue("--page").trim();
      var booted = window.__boardBooted === true;
      if (styled && booted) {
        try { sessionStorage.removeItem(KEY); } catch (e) {}
        return;
      }
      var n = tries() + 1;
      try { sessionStorage.setItem(KEY, n); } catch (e) {}
      console.error("board did not come up (styled=" + styled +
                    " booted=" + booted + ") — reload " + n);
      location.reload();
    }
    /* later each time: 20s, 40s, 60s, then every 2 minutes */
    var n = tries();
    var wait = n < 3 ? 20000 + n * 20000 : 120000;
    addEventListener("load", function () { setTimeout(check, wait); });
  })();
</script>
</head>
<body>
<div id="stage">
  <div id="drift">
    <header>
      <!-- clock and dates travel together: they occupy the first grade
           column of the grid below, which is what lets the urgent strip
           start exactly where the second card does -->
      <div class="now">
        <div id="clock">--:--</div>
        <div class="dates">
          <div id="date"></div>
          <div id="hebdate"></div>
        </div>
      </div>
      <!-- No hazard symbol here on purpose: this strip carries ordinary
           school notices, and a warning triangle reads as an emergency to
           a child walking past. The red frame and the tag are signal
           enough. The fault indicator in the footer keeps its triangle —
           that one really does mean something is broken. -->
      <div id="urgent">
        <span class="tag">הודעות חשובות</span>
        <span id="urgenttext"></span>
      </div>
      <!-- The alt text is the school name, so a failed image load leaves
           the board named rather than blank. -->
      <div id="school"><img src="vendor/school-logo.png" alt="תיכון השיטה"></div>
    </header>

    <main id="grid">
      <!-- grade cards injected here -->
      <!-- left column: day-of-the-day strip, then the agenda pane
           directly beneath it (a flex column, so the agenda takes
           whatever height the strip leaves rather than snapping to the
           grid's bottom row) -->
      <div id="leftcol">
        <section class="card" id="dayofday">
          <div class="dodicon"></div>
          <div class="dodtext"></div>
        </section>
        <section class="card" id="exams">
          <h2>אירועים ומבחנים היום</h2>
          <div id="examlist"><div class="agendawrap"></div></div>
        </section>
      </div>
    </main>

    <footer>
      <div id="msg"></div>
      <!-- bottom-left corner: freshness stamp, version, then the fault
           indicator LAST — in RTL the last child sits leftmost, which
           is where the indicator belongs -->
      <div class="statusbox">
        <span id="stamp"></span>
        <span id="version"></span>
        <span id="errind"></span>
      </div>
    </footer>
  </div>
</div>

<!-- full-screen video overlay; hidden unless a clip is playing.
     Direct/Drive files use <video>; YouTube uses its official embed. -->
<div id="videowrap">
  <video id="video" playsinline></video>
  <iframe id="ytframe" allow="autoplay; encrypted-media" frameborder="0"></iframe>
</div>

<!-- load order matters: config → sample data → CSV parser → pure
     logic → app. -->
<script src="config.js"></script>
<script src="days.js"></script>
<script src="sample-data.js"></script>
<script src="vendor/papaparse.min.js"></script>
<script src="logic.js"></script>
<script src="app.js"></script>
</body>
</html>
